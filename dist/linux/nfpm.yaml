name: "graylog-collector"
description: "Graylog Collector"

version: "${VERSION}"
release: "${VERSION_RELEASE}"

arch: "${ARCH}"
platform: "linux"

section: "optional"
priority: "extra"

maintainer: "Graylog, Inc. <hello@graylog.org>"
vendor: "Graylog"
homepage: "https://www.graylog.org/"

license: "SSPL-1"

# NOTE: The packages declare no dependencies. The install script in
# dist/install/collector-install-linux.sh relies on this and installs them
# with "dpkg -i" and "rpm -U", which do not resolve dependencies. When you
# add a "depends" section here, switch the script to apt-get, dnf, yum, or
# zypper so that dependencies get installed.

contents:
  - src: "target/graylog-collector-${VERSION}${VERSION_SUFFIX}-linux-${ARCH}"
    dst: "/usr/bin/graylog-collector"
    expand: true
    file_info:
      owner: "root"
      group: "root"
      mode: 0555

  - src: "dist/linux/graylog-collector.service"
    dst: "/usr/lib/systemd/system/graylog-collector.service"
    file_info:
      owner: "root"
      group: "root"
      mode: 0444

  - src: "dist/linux/enrollment.env.example"
    dst: "/etc/graylog/collector/enrollment.env.example"
    type: "config"
    file_info:
      owner: "root"
      group: "root"
      mode: 0444

scripts:
  preinstall: "dist/linux/preinstall.sh"
  postinstall: "dist/linux/postinstall.sh"
  preremove: "dist/linux/preremove.sh"
  postremove: "dist/linux/postremove.sh"
